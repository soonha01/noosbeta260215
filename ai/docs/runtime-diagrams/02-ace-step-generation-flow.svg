<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .header { fill: #111827; }
      .title { font: 800 38px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f9fafb; }
      .subtitle { font: 500 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d1d5db; }
      .lane { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 16; }
      .step { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .front { fill: #eff6ff; stroke: #3b82f6; }
      .back { fill: #ecfdf5; stroke: #10b981; }
      .py { fill: #fff7ed; stroke: #f97316; }
      .ace { fill: #fef2f2; stroke: #ef4444; }
      .warn { fill: #fffbeb; stroke: #f59e0b; }
      .label { font: 800 23px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .code { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #111827; }
      .num { font: 900 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .bubble { fill: #0f172a; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 3; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1040"/>
  <rect class="header" width="1600" height="110"/>
  <text class="title" x="56" y="54">ACE-Step 음악 생성 상세 흐름</text>
  <text class="subtitle" x="58" y="86">현재 구현: Backend가 로컬 ACE-Step API를 관리하고 Python CLI를 통해 작업을 제출합니다.</text>

  <rect class="lane" x="48" y="148" width="342" height="768"/>
  <text class="label" x="78" y="190">Frontend</text>
  <rect class="step front" x="78" y="230" width="282" height="112"/>
  <circle class="bubble" cx="106" cy="258" r="16"/><text class="num" x="100" y="266">1</text>
  <text class="label" x="132" y="266">Prewarm</text>
  <text class="code" x="132" y="296">prewarmJourneyGeneration()</text>
  <text class="small" x="132" y="322">/api/ai/intervention/prewarm</text>
  <rect class="step front" x="78" y="392" width="282" height="128"/>
  <circle class="bubble" cx="106" cy="420" r="16"/><text class="num" x="100" y="428">2</text>
  <text class="label" x="132" y="428">Journey Generate</text>
  <text class="code" x="132" y="458">generateJourneyBundle()</text>
  <text class="small" x="132" y="486">planet / state / duration 전송</text>
  <rect class="step front" x="78" y="570" width="282" height="116"/>
  <circle class="bubble" cx="106" cy="598" r="16"/><text class="num" x="100" y="606">9</text>
  <text class="label" x="132" y="606">Playback</text>
  <text class="small" x="132" y="636">audioUrl을 player에 연결</text>
  <text class="code" x="132" y="662">/api/ai/audio?path=...</text>

  <rect class="lane" x="430" y="148" width="342" height="768"/>
  <text class="label" x="460" y="190">Spring Backend</text>
  <rect class="step back" x="460" y="230" width="282" height="124"/>
  <circle class="bubble" cx="488" cy="258" r="16"/><text class="num" x="482" y="266">3</text>
  <text class="label" x="514" y="266">ACE Ready</text>
  <text class="code" x="514" y="296">ensureAceStepServerReady()</text>
  <text class="small" x="514" y="324">health 실패 시 로컬 서버 시작</text>
  <rect class="step back" x="460" y="404" width="282" height="124"/>
  <circle class="bubble" cx="488" cy="432" r="16"/><text class="num" x="482" y="440">4</text>
  <text class="label" x="514" y="440">Model Init</text>
  <text class="code" x="514" y="470">/v1/init</text>
  <text class="small" x="514" y="498">acestep-v15-turbo prewarm</text>
  <rect class="step back" x="460" y="578" width="282" height="140"/>
  <circle class="bubble" cx="488" cy="606" r="16"/><text class="num" x="482" y="614">8</text>
  <text class="label" x="514" y="614">Audio Proxy</text>
  <text class="small" x="514" y="644">ACE result의 path 추출</text>
  <text class="small" x="514" y="672">로컬 파일 검증 후 stream</text>
  <text class="code" x="514" y="700">streamGeneratedAudio()</text>

  <rect class="lane" x="812" y="148" width="342" height="768"/>
  <text class="label" x="842" y="190">Python NOOS AI</text>
  <rect class="step py" x="842" y="230" width="282" height="128"/>
  <circle class="bubble" cx="870" cy="258" r="16"/><text class="num" x="864" y="266">5</text>
  <text class="label" x="896" y="266">Intervention Spec</text>
  <text class="code" x="896" y="296">noos_ai.cli</text>
  <text class="small" x="896" y="324">transition / lighting / music spec 생성</text>
  <rect class="step py" x="842" y="410" width="282" height="132"/>
  <circle class="bubble" cx="870" cy="438" r="16"/><text class="num" x="864" y="446">6</text>
  <text class="label" x="896" y="446">ACE Payload</text>
  <text class="code" x="896" y="476">music.py</text>
  <text class="small" x="896" y="504">model=acestep-v15-turbo</text>
  <text class="small" x="896" y="528">thinking=false 기본값</text>
  <rect class="step py" x="842" y="592" width="282" height="126"/>
  <circle class="bubble" cx="870" cy="620" r="16"/><text class="num" x="864" y="628">7</text>
  <text class="label" x="896" y="628">Submit + Poll</text>
  <text class="code" x="896" y="658">AceStepClient</text>
  <text class="small" x="896" y="686">/release_task -> /query_result</text>

  <rect class="lane" x="1194" y="148" width="358" height="768"/>
  <text class="label" x="1224" y="190">ACE-Step API</text>
  <rect class="step ace" x="1224" y="230" width="298" height="132"/>
  <text class="label" x="1248" y="268">Runtime</text>
  <text class="code" x="1248" y="298">127.0.0.1:8011</text>
  <text class="small" x="1248" y="326">start_acestep_api.sh</text>
  <rect class="step ace" x="1224" y="410" width="298" height="144"/>
  <text class="label" x="1248" y="448">Generation</text>
  <text class="small" x="1248" y="478">Text embedding</text>
  <text class="small" x="1248" y="506">DiT diffusion 병목</text>
  <text class="small" x="1248" y="532">VAE decode + mp3 save</text>
  <rect class="step ace" x="1224" y="604" width="298" height="112"/>
  <text class="label" x="1248" y="642">Result</text>
  <text class="small" x="1248" y="672">/v1/audio?path=...</text>
  <text class="small" x="1248" y="696">generated mp3 path 반환</text>

  <path class="arrow" d="M360 286 C404 286 416 292 460 292"/>
  <path class="arrow" d="M742 292 C788 292 798 294 842 294"/>
  <path class="arrow" d="M1124 474 C1168 474 1180 474 1224 474"/>
  <path class="arrow" d="M1124 655 C1170 655 1178 660 1224 660"/>
  <path class="arrow" d="M1224 660 C1110 760 870 760 742 650"/>
  <path class="arrow" d="M460 650 C410 650 394 632 360 632"/>
  <path class="dash" d="M742 466 C908 372 1052 296 1224 296"/>
  <path class="dash" d="M742 292 C918 214 1040 250 1224 296"/>

  <rect class="step warn" x="48" y="944" width="1504" height="64"/>
  <text class="label" x="78" y="982">원격 4080 PC로 옮길 때 주의</text>
  <text class="small" x="380" y="982">현재 audio proxy는 ACE-Step 결과 path가 백엔드 로컬 파일이라고 가정합니다. 원격 ACE-Step이면 HTTP 프록시 또는 파일 다운로드 단계가 필요합니다.</text>
</svg>
