<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .head { fill: #0f172a; }
      .title { font: 800 38px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .col { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .groupTitle { font: 800 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .file { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; rx: 12; }
      .front { fill: #eff6ff; stroke: #60a5fa; }
      .back { fill: #ecfdf5; stroke: #34d399; }
      .py { fill: #fff7ed; stroke: #fb923c; }
      .ai { fill: #f5f3ff; stroke: #a78bfa; }
      .vendor { fill: #fef2f2; stroke: #f87171; }
      .code { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .desc { font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .note { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect class="bg" width="1700" height="1180"/>
  <rect class="head" width="1700" height="112"/>
  <text class="title" x="56" y="54">세부 파일 책임 지도</text>
  <text class="subtitle" x="58" y="86">현재 NOOS AI 실행 구조에서 실제로 중요한 파일과 역할</text>

  <rect class="col" x="48" y="150" width="378" height="850"/>
  <text class="groupTitle" x="78" y="194">Frontend</text>
  <rect class="file front" x="78" y="226" width="318" height="124"/>
  <text class="code" x="102" y="260">frontend/src/lib/noosAiApi.js</text>
  <text class="desc" x="102" y="290">백엔드 AI API 호출 진입점</text>
  <text class="desc" x="102" y="318">Journey 생성, prewarm, Copilot fallback 조율</text>
  <rect class="file front" x="78" y="382" width="318" height="132"/>
  <text class="code" x="102" y="416">frontend/src/lib/noosLiteRtGemma.js</text>
  <text class="desc" x="102" y="446">브라우저 WebGPU Gemma LiteRT 실행</text>
  <text class="desc" x="102" y="474">지원 안 되면 backend Gemma로 fallback</text>
  <rect class="file front" x="78" y="546" width="318" height="118"/>
  <text class="code" x="102" y="580">frontend/src/lib/noosLiteRtTasks.js</text>
  <text class="desc" x="102" y="610">Gemma prompt와 fallback output 정의</text>
  <rect class="file front" x="78" y="696" width="318" height="132"/>
  <text class="code" x="102" y="730">SpaceTravel / TravelPlayerPage</text>
  <text class="desc" x="102" y="760">Journey 생성 UI와 오디오 재생 화면</text>
  <text class="desc" x="102" y="788">audioUrl을 player source로 연결</text>

  <rect class="col" x="466" y="150" width="378" height="850"/>
  <text class="groupTitle" x="496" y="194">Backend</text>
  <rect class="file back" x="496" y="226" width="318" height="124"/>
  <text class="code" x="520" y="260">NoosAiController.java</text>
  <text class="desc" x="520" y="290">/api/ai/... endpoint 선언</text>
  <text class="desc" x="520" y="318">music, prewarm, audio, Gemma task route</text>
  <rect class="file back" x="496" y="382" width="318" height="164"/>
  <text class="code" x="520" y="416">NoosAiService.java</text>
  <text class="desc" x="520" y="446">전체 오케스트레이션 핵심</text>
  <text class="desc" x="520" y="474">Python CLI 실행, ACE-Step 관리</text>
  <text class="desc" x="520" y="502">Gemma service proxy, audio proxy</text>
  <rect class="file back" x="496" y="578" width="318" height="126"/>
  <text class="code" x="520" y="612">application.properties</text>
  <text class="desc" x="520" y="642">ACE / Gemma base-url 설정</text>
  <text class="desc" x="520" y="670">현재 기본값은 localhost</text>
  <rect class="file back" x="496" y="736" width="318" height="118"/>
  <text class="code" x="520" y="770">CorsConfig.java</text>
  <text class="desc" x="520" y="800">현재 localhost:3000만 허용</text>
  <text class="desc" x="520" y="828">Vite/원격 실행 시 확장 필요</text>

  <rect class="col" x="884" y="150" width="378" height="850"/>
  <text class="groupTitle" x="914" y="194">Python NOOS AI</text>
  <rect class="file py" x="914" y="226" width="318" height="118"/>
  <text class="code" x="938" y="260">ai/noos_ai/cli.py</text>
  <text class="desc" x="938" y="290">Python 세션 실행 진입점</text>
  <text class="desc" x="938" y="318">ACE-Step 작업 제출/폴링</text>
  <rect class="file py" x="914" y="376" width="318" height="128"/>
  <text class="code" x="938" y="410">sessions/intervention.py</text>
  <text class="desc" x="938" y="440">intervention 결과 JSON 조립</text>
  <text class="desc" x="938" y="468">lighting_spec / music_spec 포함</text>
  <rect class="file py" x="914" y="536" width="318" height="148"/>
  <text class="code" x="938" y="570">intervention/music.py</text>
  <text class="desc" x="938" y="600">ACE-Step default/enhanced request 생성</text>
  <text class="desc" x="938" y="628">duration cap, inference steps 결정</text>
  <text class="desc" x="938" y="656">기본 모델: acestep-v15-turbo</text>
  <rect class="file py" x="914" y="716" width="318" height="126"/>
  <text class="code" x="938" y="750">integrations/ace_step.py</text>
  <text class="desc" x="938" y="780">ACE-Step HTTP client</text>
  <text class="desc" x="938" y="808">release_task / query_result 래핑</text>

  <rect class="col" x="1302" y="150" width="350" height="850"/>
  <text class="groupTitle" x="1332" y="194">Runtimes / Vendor</text>
  <rect class="file ai" x="1332" y="226" width="290" height="138"/>
  <text class="code" x="1354" y="260">gemma/service.py</text>
  <text class="desc" x="1354" y="290">FastAPI Gemma task server</text>
  <text class="desc" x="1354" y="318">cache, warmup, fallback response</text>
  <rect class="file ai" x="1332" y="396" width="290" height="138"/>
  <text class="code" x="1354" y="430">gemma/runtime.py</text>
  <text class="desc" x="1354" y="460">Gemma model load/generate</text>
  <text class="desc" x="1354" y="488">auto device: mps/cuda/cpu</text>
  <rect class="file vendor" x="1332" y="566" width="290" height="148"/>
  <text class="code" x="1354" y="600">vendor/ACE-Step-1.5</text>
  <text class="desc" x="1354" y="630">실제 음악 생성 엔진</text>
  <text class="desc" x="1354" y="658">acestep-v15-turbo DiT</text>
  <text class="desc" x="1354" y="686">선택 LM: 5Hz-lm-1.7B</text>
  <rect class="file vendor" x="1332" y="746" width="290" height="124"/>
  <text class="code" x="1354" y="780">scripts/start_acestep_api.sh</text>
  <text class="desc" x="1354" y="810">ACE-Step API 기동 스크립트</text>
  <text class="desc" x="1354" y="838">Apple Silicon 최적 env 설정</text>

  <rect class="note" x="48" y="1040" width="1604" height="82"/>
  <text class="groupTitle" x="78" y="1078">원격 4080 구조로 바꿀 때 수정 우선순위</text>
  <text class="desc" x="78" y="1108">1) ACE-Step base-url 원격화  2) auto-start를 local only로 분리  3) ACE 결과 mp3를 HTTP proxy/download로 처리  4) CORS origin 정리</text>
</svg>
