[project]
name = "noos-ai"
version = "0.1.0"
description = "Transparent recognition-session EEG engine for NOOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "noos_ai",
  "noos_ai.eeg",
  "noos_ai.intervention",
  "noos_ai.integrations",
  "noos_ai.sessions",
]
