<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%BASE_URL%media/icons/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Project NOOS - Brain-Computer Interface Technology"
    />
    <script>
      (function () {
        if (typeof window === "undefined" || window.__NOOS_MATCH_MEDIA_COMPAT__) {
          return;
        }

        var createFallbackMql = function (query) {
          return {
            matches: false,
            media: query,
            onchange: null,
            addListener: function () {},
            removeListener: function () {},
            addEventListener: function () {},
            removeEventListener: function () {},
            dispatchEvent: function () { return false; }
          };
        };

        var normalizeMql = function (result, query) {
          var mql = result || createFallbackMql(query);

          if (typeof mql.addEventListener !== "function") {
            mql.addEventListener = function () {};
          }

          if (typeof mql.removeEventListener !== "function") {
            mql.removeEventListener = function () {};
          }

          if (typeof mql.addListener !== "function") {
            mql.addListener = function (listener) {
              mql.addEventListener("change", listener);
            };
          }

          if (typeof mql.removeListener !== "function") {
            mql.removeListener = function (listener) {
              mql.removeEventListener("change", listener);
            };
          }

          if (typeof mql.dispatchEvent !== "function") {
            mql.dispatchEvent = function () { return false; };
          }

          if (typeof mql.matches !== "boolean") {
            mql.matches = false;
          }

          if (typeof mql.media !== "string") {
            mql.media = query;
          }

          return mql;
        };

        if (typeof window.matchMedia !== "function") {
          window.matchMedia = function (query) {
            return createFallbackMql(query);
          };
          window.__NOOS_MATCH_MEDIA_COMPAT__ = true;
          return;
        }

        var originalMatchMedia = window.matchMedia.bind(window);
        window.matchMedia = function (query) {
          try {
            return normalizeMql(originalMatchMedia(query), query);
          } catch (error) {
            return createFallbackMql(query);
          }
        };

        window.__NOOS_MATCH_MEDIA_COMPAT__ = true;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400;500;700&display=swap" rel="stylesheet">
