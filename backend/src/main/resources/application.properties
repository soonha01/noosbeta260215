spring.application.name=backend

# ?? ???
spring.profiles.include=secret

# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/noos_db
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=com.noos.backend.auth

# NOOS AI local runtimes
noos.ai.python-bin=python3
noos.ai.ace-step.base-url=http://127.0.0.1:8011
noos.ai.ace-step.timeout-sec=900
noos.ai.gemma.enabled=true
noos.ai.gemma.base-url=http://127.0.0.1:8091
noos.ai.gemma.timeout-sec=120
